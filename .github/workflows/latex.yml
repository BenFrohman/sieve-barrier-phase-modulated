name: LaTeX

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow compiles the preprint and checks committed file hashes.
# It is not a Lean build and issues no mathematical certificate.

jobs:
  build:
    name: Compile preprint and verify hashes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify committed archival hashes
        run: sha256sum -c SHA256SUMS

      - name: Stage a side copy of the source
        run: |
          mkdir -p ci-build
          cp paper/Frohman_Sieve_Barrier_Preprint_2026.tex ci-build/
          # Also compile the 13 September NoGo source.
          cp paper/archive/2026-09-13/Frohman_Local_Sieve_NoGo_2026.tex ci-build/

      - name: Compile canonical preprint
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Frohman_Sieve_Barrier_Preprint_2026.tex
          working_directory: ci-build

      - name: Compile 13 September Local Sieve NoGo source
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Frohman_Local_Sieve_NoGo_2026.tex
          working_directory: ci-build

      - name: Report overfull boxes
        run: |
          echo "Overfull/Underfull boxes (informational only; not a certificate):"
          found=0
          for log in ci-build/*.log; do
            echo "==== ${log} ===="
            if grep -E 'Overfull \\hbox|Underfull \\hbox' "$log"; then
              found=1
            else
              echo "None reported."
            fi
          done
          # Do not fail the job on overfull boxes. A CI rebuild may also
          # differ in page count from the official deposited PDF.
          exit 0

      - name: Confirm official PDF was not overwritten
        run: sha256sum -c SHA256SUMS

      - name: Upload CI rebuild PDFs (not the official deposited files)
        uses: actions/upload-artifact@v4
        with:
          name: ci-rebuild-pdfs
          path: |
            ci-build/Frohman_Sieve_Barrier_Preprint_2026.pdf
            ci-build/Frohman_Local_Sieve_NoGo_2026.pdf
